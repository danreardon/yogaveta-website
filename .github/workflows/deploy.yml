name: Deploy to Cloudflare

# Merging to main deploys. While wrangler.toml has no routes, that means the
# workers.dev staging address only; yogaveta.com is untouched.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npm run build
      - name: Refuse to deploy an empty site
        run: test -f _site/index.html || { echo "::error::no _site/index.html"; exit 1; }
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
